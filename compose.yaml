services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foms
      POSTGRES_USER: foms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foms-local-only}
    volumes:
      - foms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foms -d foms"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: build
    command: ["npm", "run", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://foms:${POSTGRES_PASSWORD:-foms-local-only}@db:5432/foms?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://foms:${POSTGRES_PASSWORD:-foms-local-only}@db:5432/foms?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-only-change-before-deployment-000000000000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${FOMS_BIND_ADDRESS:-0.0.0.0}:${FOMS_PORT:-3000}:3000"
    volumes:
      - foms-uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  foms-postgres-data:
  foms-uploads:
