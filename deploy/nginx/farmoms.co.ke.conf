server {
    listen 80;
    listen [::]:80;
    server_name farmoms.co.ke www.farmoms.co.ke;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/foms-acme;
    }

    location / {
        return 301 https://farmoms.co.ke$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.farmoms.co.ke;

    ssl_certificate /etc/letsencrypt/live/farmoms.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmoms.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://farmoms.co.ke$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name farmoms.co.ke;

    ssl_certificate /etc/letsencrypt/live/farmoms.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmoms.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
